services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ngo
      POSTGRES_PASSWORD: ngo
      POSTGRES_DB: ngo
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngo -d ngo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8010:8000"
    environment:
      DEBUG: "true"
      SECRET_KEY: dev-only-change-me
      DATABASE_URL: postgresql+psycopg://ngo:ngo@db:5432/ngo
      AUTO_SEED: "true"
      ADMIN_EMAIL: admin@ngo.local
      ADMIN_PASSWORD: Admin@12345
      ADMIN_NAME: Super Admin
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
